spring.application.name=pontoliga

# ---------- Banco de dados (PostgreSQL) ----------
# Valores lidos de variáveis de ambiente: nada de senha neste arquivo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pontoliga}
spring.datasource.username=${DB_USERNAME:pontoliga_app}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA / Hibernate ----------
# "update" cria as tabelas que faltam na primeira execução.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Instantes são gravados em UTC; a ata usa o fuso America/Bahia (definido no código)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Sessão do administrador ----------
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Em produção (HTTPS), defina COOKIE_SECURE=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---------- Erros: nunca expor detalhes internos ----------
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---------- Administrador inicial (criado só se ainda não existir) ----------
app.admin.username=ADMIN
app.admin.password=${ADMIN_PASSWORD:}

# ---------- Chave do equipamento (Raspberry Pi), enviada no cabeçalho X-API-Key ----------
app.rfid.api-key=${RFID_API_KEY:}
