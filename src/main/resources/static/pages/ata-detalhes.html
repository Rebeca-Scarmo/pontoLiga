<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ata - PontoLiga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Khula:wght@400;600&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topo no-print">
    <div class="topo-marca">
      <span class="marca-nome">PontoLiga</span>
      <span class="marca-sub">Liga Calabotics</span>
    </div>
    <nav class="menu">
      <a href="/pages/atas.html" class="ativo">Atas</a>
      <a href="/pages/membros.html">Membros</a>
    </nav>
    <div class="topo-usuario">
      <span id="usuario-logado">ADMIN</span>
      <button type="button" id="btn-sair" class="btn btn-sobre-escuro">Sair</button>
    </div>
  </header>

  <main class="conteudo">
    <!-- Identificação que aparece somente no papel / PDF -->
    <div class="somente-impressao identificacao-impressao">
      <strong>PontoLiga</strong> - Liga Acadêmica de Robótica Calabotics<br>
      Universidade Católica do Salvador (UCSal)
    </div>

    <p class="no-print"><a href="/pages/atas.html">Voltar para as atas</a></p>

    <p id="erro" class="mensagem-erro" role="alert" hidden></p>

    <section id="ata" hidden>
      <div class="ata-titulo-linha">
        <h1 id="ata-titulo"></h1>
        <button type="button" id="btn-imprimir" class="btn btn-primario no-print">Imprimir / Salvar como PDF</button>
      </div>

      <dl class="ata-info">
        <div><dt>Data</dt><dd id="ata-data"></dd></div>
        <div><dt>Primeiro registro</dt><dd id="ata-primeiro"></dd></div>
        <div><dt>Último registro</dt><dd id="ata-ultimo"></dd></div>
      </dl>

      <div class="tabela-rolagem">
        <table>
          <thead>
            <tr>
              <th>Membro</th>
              <th>Matrícula</th>
              <th>Entrada</th>
              <th>Saída</th>
              <th>Carga horária</th>
            </tr>
          </thead>
          <tbody id="corpo-ata"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ata-detalhes.js"></script>
</body>
</html>
