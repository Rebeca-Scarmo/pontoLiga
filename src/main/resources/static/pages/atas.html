<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atas - PontoLiga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Khula:wght@400;600&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topo no-print">
    <div class="topo-marca">
      <span class="marca-nome">PontoLiga</span>
      <span class="marca-sub">Liga Calabotics</span>
    </div>
    <nav class="menu">
      <a href="/pages/atas.html" class="ativo">Atas</a>
      <a href="/pages/membros.html">Membros</a>
    </nav>
    <div class="topo-usuario">
      <span id="usuario-logado">ADMIN</span>
      <button type="button" id="btn-sair" class="btn btn-sobre-escuro">Sair</button>
    </div>
  </header>

  <main class="conteudo">
    <h1>Atas de presença</h1>

    <p id="erro" class="mensagem-erro" role="alert" hidden></p>
    <p id="aviso" class="aviso-vazio" hidden>
      Ainda não há atas. Cada ata é criada automaticamente quando o primeiro registro do dia chega do leitor de cartões.
    </p>

    <div class="tabela-rolagem">
      <table id="tabela-atas" hidden>
        <thead>
          <tr>
            <th>Ata</th>
            <th>Data</th>
            <th>Primeiro registro</th>
            <th>Último registro</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="corpo-atas"></tbody>
      </table>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/atas.js"></script>
</body>
</html>
